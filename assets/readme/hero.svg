<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 362" width="1200" height="362" role="img" aria-labelledby="hero-title">
  <title id="hero-title">osstrich reads your repo's dependencies, finds the one whose next step is also their open issue, and ships a pull request in the maintainer's own voice</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.72" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <style>
      .card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .more { stroke-dasharray: 4 4; }
      .glyph { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .ok { stroke: #16a34a; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; font-weight: 600; }
      .muted { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #64748b; font-weight: 500; }
      .wrong { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #b91c1c; font-weight: 600; }
      .flow { fill: none; stroke: #d97706; stroke-width: 2; }
      .dot { fill: #d97706; }
      .bar { fill: #cbd5e1; }
      .pill { fill: #334155; }
      .code { fill: #1e293b; } .codeline { fill: #64748b; }
      .stale { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 3 3; } .dead { fill: #93c5fd; }
      .mark { fill: #dc2626; } .lead { stroke: #dc2626; stroke-width: 2; } .good { fill: #16a34a; } .goodlead { stroke: #16a34a; stroke-width: 2; }
      .fold { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 5; }
      .rule { stroke: #94a3b8; stroke-width: 2; }
      .sheet { stroke: #94a3b8; stroke-width: 2; }
      .front { fill: #ffffff; stroke: #64748b; } .back1 { fill: #f4f7fa; } .back2 { fill: #eef2f7; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #1e293b; stroke: #64748b; } .glyph { stroke: #cbd5e1; } .ok { stroke: #4ade80; }
        .title { fill: #f1f5f9; } .muted { fill: #94a3b8; } .wrong { fill: #fca5a5; } .bar { fill: #475569; } .pill { fill: #cbd5e1; } .rule { stroke: #64748b; }
        .code { fill: #020617; } .codeline { fill: #475569; } .dead { fill: #3b82f6; } .stale, .lead, .fold { stroke: #f87171; } .mark { fill: #f87171; } .good { fill: #4ade80; } .goodlead { stroke: #4ade80; }
        .sheet { stroke: #64748b; } .front { fill: #0f172a; stroke: #94a3b8; } .back1 { fill: #172033; } .back2 { fill: #1e293b; }
      }
    </style>
  </defs>
  <g><rect class="card" x="24" y="22" width="190" height="118" rx="14"/>
    <g class="glyph" transform="translate(97,42) scale(1.571)"><path d="M2,8 h9 l3,4 h12 v16 h-24 z"/><path d="M2,12 h24"/></g>
    <text class="title" x="119" y="118" font-size="19" text-anchor="middle">Your repo</text></g>
  <path class="flow" d="M220,81 C 272,81 300,136 336,166" marker-end="url(#arrow)"/>
  <text class="muted" x="278" y="64" font-size="15" text-anchor="middle">libraries you run</text>
  <g><rect class="card" x="24" y="222" width="190" height="118" rx="14"/>
    <g class="glyph" transform="translate(97,242) scale(2.2)"><circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="4"/><circle cx="10" cy="10" r="1"/></g>
    <text class="title" x="119" y="318" font-size="19" text-anchor="middle">Their repos</text></g>
  <path class="flow" d="M220,281 C 272,281 300,226 336,196" marker-end="url(#arrow)"/>
  <text class="muted" x="278" y="314" font-size="15" text-anchor="middle">open issues</text>
  <circle class="dot" cx="352" cy="181" r="6"/>
  <path class="flow" d="M358,181 C 412,181 422,42 437,42" marker-end="url(#arrow)"/>
  <g transform="translate(443,22)"><rect class="card" x="0" y="0" width="210" height="40" rx="10"/>
    <g class="glyph" transform="translate(14,10)"><path d="M10,1 l2.5,2 3,-0.5 1,3 2.5,1.5 -1,3 1,3 -2.5,1.5 -1,3 -3,-0.5 -2.5,2 -2.5,-2 -3,0.5 -1,-3 -2.5,-1.5 1,-3 -1,-3 2.5,-1.5 1,-3 3,0.5 z"/><path d="M6.5,10 l2.5,2.5 4.5,-5"/></g>
    <text class="title" x="48" y="26" font-size="17">Ranks by need</text></g>
  <path class="flow" d="M358,181 C 412,181 422,96 451,96" marker-end="url(#arrow)"/>
  <g transform="translate(457,76)"><rect class="card" x="0" y="0" width="210" height="40" rx="10"/>
    <g class="glyph" transform="translate(14,10)"><path d="M8,12 a3,3 0 0 1 0,-4 l3,-3 a3,3 0 0 1 4,4 l-1,1"/><path d="M12,8 a3,3 0 0 1 0,4 l-3,3 a3,3 0 0 1 -4,-4 l1,-1"/></g>
    <text class="title" x="48" y="26" font-size="17">Finds overlap</text></g>
  <path class="flow" d="M358,181 C 412,181 422,150 465,150" marker-end="url(#arrow)"/>
  <g transform="translate(471,130)"><rect class="card" x="0" y="0" width="210" height="40" rx="10"/>
    <g class="glyph" transform="translate(14,10)"><path d="M10,1 l8,3 v6 c0,5 -4,8 -8,9 c-4,-1 -8,-4 -8,-9 v-6 z"/><path d="M6.5,10 l2.5,2.5 4.5,-5"/></g>
    <text class="title" x="48" y="26" font-size="17">Gates the fix</text></g>
  <path class="flow" d="M358,181 C 412,181 422,204 465,204" marker-end="url(#arrow)"/>
  <g transform="translate(471,184)"><rect class="card" x="0" y="0" width="210" height="40" rx="10"/>
    <g class="glyph" transform="translate(14,10) scale(0.833)"><circle cx="7" cy="5" r="2.5"/><circle cx="17" cy="5" r="2.5"/><circle cx="12" cy="20" r="2.5"/><path d="M7,7.5 V12 C7,15.5 9.5,16.5 10.7,17.5"/><path d="M17,7.5 V12 C17,15.5 14.5,16.5 13.3,17.5"/></g>
    <text class="title" x="48" y="26" font-size="17">Writes their way</text></g>
  <path class="flow" d="M358,181 C 412,181 422,258 451,258" marker-end="url(#arrow)"/>
  <g transform="translate(457,238)"><rect class="card" x="0" y="0" width="210" height="40" rx="10"/>
    <g class="glyph" transform="translate(14,10) scale(0.833)"><path d="M21,8 V21 H3 V8"/><rect x="1" y="3" width="22" height="5"/><path d="M10,12 H14"/></g>
    <text class="title" x="48" y="26" font-size="17">Records the run</text></g>
  <path class="flow" d="M358,181 C 412,181 422,312 437,312" marker-end="url(#arrow)"/>
  <g transform="translate(443,292)"><rect class="card more" x="0" y="0" width="210" height="40" rx="10"/>
    <g class="glyph" transform="translate(14,10)"><circle cx="4" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="16" cy="10" r="1.5"/></g>
    <text class="muted" x="48" y="26" font-size="17">and more</text></g>
  <path class="flow" d="M653,42 C 713,42 780,181 844,181"/>
  <path class="flow" d="M667,96 C 727,96 780,181 844,181"/>
  <path class="flow" d="M681,150 C 741,150 780,181 844,181"/>
  <path class="flow" d="M681,204 C 741,204 780,181 844,181"/>
  <path class="flow" d="M667,258 C 727,258 780,181 844,181"/>
  <path class="flow" d="M653,312 C 713,312 780,181 844,181"/>
  <circle class="dot" cx="850" cy="181" r="6"/>
  <path class="flow" d="M856,181 L 888,181" marker-end="url(#arrow)"/>
  <rect class="sheet back2" x="928" y="51" width="212" height="274" rx="10"/>
  <rect class="sheet back1" x="914" y="37" width="212" height="274" rx="10"/>
  <rect class="sheet front" x="900" y="23" width="212" height="274" rx="10"/>
  <text class="title" x="1006" y="63" font-size="20" text-anchor="middle">Pull request</text>
  <rect class="bar" x="956" y="79" width="100" height="8" rx="4"/>
  <rect class="pill" x="934" y="101" width="38" height="10" rx="5"/>
  <rect class="pill" x="984" y="101" width="38" height="10" rx="5"/>
  <rect class="pill" x="1034" y="101" width="38" height="10" rx="5"/>
  <rect class="card" x="922" y="127" width="168" height="62" rx="8"/>
  <path class="flow" d="M940,158 C 970,158 990,141 1010,141" marker-end="url(#arrow)"/>
  <path class="flow" d="M940,158 C 970,158 990,175 1010,175" marker-end="url(#arrow)"/>
  <circle class="dot" cx="938" cy="158" r="4"/>
  <rect class="bar" x="922" y="209" width="120" height="8" rx="4"/>
  <rect class="bar" x="922" y="229" width="96" height="8" rx="4"/>
  <rect class="bar" x="922" y="249" width="132" height="8" rx="4"/>
  <rect class="bar" x="922" y="269" width="84" height="8" rx="4"/>
  <g class="glyph ok" transform="translate(1050,255) scale(1.2)"><circle cx="10" cy="10" r="8"/><path d="M6.5,10 l2.5,2.5 4.5,-5"/></g>
  <text class="title" x="1020" y="349" font-size="16" text-anchor="middle">a merged pull request</text>
  <text class="muted" x="1020" y="369" font-size="14" text-anchor="middle">opened, reviewed, merged upstream</text>
</svg>
