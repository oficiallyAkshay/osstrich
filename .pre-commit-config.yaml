# The same check CI runs, run here through pre-commit — mirrors
# clonometer's own local-hook pattern for a tool that's the project's own
# dependency rather than a pre-commit-maintained mirror. ESLint has no
# official pre-commit mirror repo, and a third-party mirror would need its
# own copy of every plugin version pinned in package.json, risking drift
# from what CI actually runs; `npx eslint` always uses THIS repo's installed
# eslint.config.mjs and plugin versions.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Staged changes only. CI's lint job runs gitleaks-action separately,
      # over the whole history, which this hook cannot see. `osstrich`
      # itself also shells out to a `gitleaks` on PATH at runtime, but that
      # scrubs the diffs it prepares for an upstream repo, never this one.
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        description: >-
          Lint the whole repo with this project's own ESLint config — not
          staged-files-only, so local and CI always agree on what's clean.
        entry: npx eslint .
        language: system
        pass_filenames: false
        always_run: true
