# The test suite on every push to main and every pull request. release.yml
# runs the same tests, but only once a version tag exists, which is far too
# late to learn that main is broken.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A second push to a pull request supersedes the first, so cancel the run it
# replaced. Pushes to main key on the commit instead, so a rapid second push
# gets its own group rather than dropping the first push's run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Codecov uploads with an OIDC token rather than a repository secret.
      id-token: write
    strategy:
      # One version failing should still report the other, rather than
      # cancelling it and leaving the result unknown.
      fail-fast: false
      matrix:
        # Not 20: execa and cockatiel both require Node 22, so the suite
        # cannot run there at all. package.json's engines field now says
        # ">=22" to match (the lint pass below caught the old ">=20" via
        # n/no-unsupported-features/node-builtins flagging global `fetch`).
        # 22 is the real floor and 24 is the current line.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

      # One report per run, so only the newest leg uploads. The upload is
      # tokenless: it authenticates with the job's OIDC identity, which
      # Codecov accepts from a public repository. A Codecov outage must not
      # block a merge, so the step reports and moves on.
      - name: upload coverage
        if: matrix.node == 24
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          use_oidc: true
          files: coverage.lcov
          fail_ci_if_error: false

  # Lint is its own job, not a step on the test matrix: it is
  # version-independent, so running it twice tells you nothing the first run
  # did not, and a lint failure should read as a lint failure rather than as
  # "the Node 24 leg went red".
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks reads pull request metadata to report what it finds.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history below, not just the working tree.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      # The same hooks contributors run locally (.pre-commit-config.yaml), so
      # CI and the pre-commit config cannot drift — a change to how the
      # eslint or gitleaks hook is invoked only has to be made once. pipx
      # ships preinstalled on the runner image, so this needs no extra setup
      # step for a repo with no other Python use. gitleaks's own pre-commit
      # hook only sees staged files, which is nothing on a fresh checkout;
      # the step below covers the full history that hook cannot see.
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

      - name: secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The one context a required-checks rule needs to know. It exists on every
  # run whatever the matrix does, and fails unless every job it needs
  # actually succeeded.
  ci:
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
