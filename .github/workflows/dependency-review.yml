# Dependency Review scans the manifest changes in a pull request for
# known-vulnerable packages, dev dependencies included, and comments on the
# pull request when it finds one. Advisory alongside the weekly npm audit
# run: this one runs at pull request time, before a vulnerable dependency
# lands.
name: dependency-review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Dependency review needs a public repo or Advanced Security. Skip
    # only when we positively know the repo is private, so a payload
    # without this context runs rather than silently skips; a run while
    # still private just fails loudly instead.
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
