name: readme check
on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
permissions: {}

# Keyed like every other workflow here: by ref on a pull request, cancelling
# the run it replaced; by commit sha on a push or the weekly schedule, where
# there is nothing to cancel.
concurrency:
  group: readme-check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readmerlin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oficiallyAkshay/readmerlin@63f78b5379bcdeff23a443ecf165ceb43544eebb # v1.0.2
        with:
          # Runs every count-source command in readmerlin.json so a count
          # badge that drifts from what the command actually prints fails
          # the check, instead of only warning that it went unverified.
          exec: "true"
