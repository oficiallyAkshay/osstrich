# Fires on a version tag only (never on a schedule). Packs the package and
# attaches it to the release as osstrich.tgz, so `npm install` of that file is
# one counted download and the README's installs badge stays live.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v6
      - run: node --test 'test/**/*.test.mjs'
      - run: |
          npm pack
          mv osstrich-*.tgz osstrich.tgz
      - run: gh release create "$GITHUB_REF_NAME" osstrich.tgz --generate-notes || gh release upload "$GITHUB_REF_NAME" osstrich.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
