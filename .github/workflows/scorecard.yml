# OSSF Scorecard rates the repository's own supply-chain hygiene (branch
# protection, pinned actions, review coverage) and publishes the score.
# Advisory only: nothing here blocks a merge.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly, off the hour and off the other scheduled workflows here, so none
    # of them compete for a runner minute.
    - cron: "38 5 * * 3"

permissions: {}

concurrency:
  group: scorecard-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Scorecard requires a public repo. Skip only when we positively know
    # the repo is private, so a payload without this context (e.g.
    # schedule) runs rather than silently skips; a run while still
    # private just fails loudly instead.
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Scorecard authenticates its publish with the job's OIDC identity
      # rather than a repository secret.
      id-token: write
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
